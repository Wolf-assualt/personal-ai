<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YUVA AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ========================================
         LOGIN SCREEN
    ========================================= -->

    <div id="loginScreen" class="login-screen">

        <div class="login-card">

            <div class="login-logo">
    <div class="ai-orb">
        <div class="orb-core"></div>
        <div class="orb-ring ring-1"></div>
        <div class="orb-ring ring-2"></div>
        <div class="orb-ring ring-3"></div>
    </div>
</div>
                
            

            <h1>YUVA AI</h1>

            <p class="login-subtitle">
    Personal AI Assistant
</p>

<div class="system-status">
    <span class="status-dot"></span>
    AI SYSTEM ONLINE
</div>
                
            

            <p class="login-description">
                Enter your access password
            </p>

            <input
                type="password"
                id="creatorPassword"
                placeholder="Enter password"
                autocomplete="current-password"
            >

            <button onclick="creatorLogin()">
                Enter YUVA
            </button>

            <p id="loginMessage" class="login-message"></p>

            <div class="guest-divider">
                <span>or</span>
            </div>

            <button
                class="guest-button"
                onclick="continueAsGuest()"
            >
                Continue as Guest
            </button>

        </div>

    </div>


    <!-- ========================================
         MAIN AI APPLICATION
    ========================================= -->

    <div id="app" class="app">

       <header class="topbar">

    <!-- YUVA BRAND -->
    <div class="brand">

        <div class="brand-orb">
            <div class="mini-orb-core"></div>
            <div class="mini-orb-ring ring-a"></div>
            <div class="mini-orb-ring ring-b"></div>
        </div>

        <div class="brand-info">
            <div class="brand-title-row">
                <h2>YUVA AI</h2>

                <span class="online-badge">
                    <span></span>
                    ONLINE
                </span>
            </div>

            <span id="status">
                Personal AI Assistant
            </span>
        </div>

    </div>


    <!-- HEADER ACTIONS -->
    <div class="topbar-actions">

        <button
            id="voiceToggle"
            class="topbar-button"
            onclick="toggleVoiceOutput()"
            title="Toggle spoken replies"
        >
            🔊
            <span>Voice</span>
        </button>

        <button
            class="topbar-button"
            onclick="clearMemory()"
            title="Start a new conversation"
        >
            ＋
            <span>New Chat</span>
        </button>

        <button
            class="logout-button"
            onclick="creatorLogout()"
            title="Logout"
        >
            ↪
        </button>

    </div>

</header>


        <!-- ========================================
             CHAT
        ========================================= -->

        <main id="chat" class="chat">

        <div class="welcome-screen">

    <div class="welcome-orb">
        <div class="welcome-orb-core"></div>
        <div class="welcome-orb-ring ring-a"></div>
        <div class="welcome-orb-ring ring-b"></div>
    </div>

    <h1>YUVA AI</h1>

    <p class="welcome-subtitle">
        Your personal AI companion
    </p>

    <p class="welcome-text">
        Ask me anything. I'm ready when you are.
    </p>

    <div class="quick-actions">

        <button onclick="quickMessage('Tell me something interesting')">
            ✨ Something interesting
        </button>

        <button onclick="quickMessage('Help me learn something')">
            🧠 Help me learn
        </button>

        <button onclick="quickMessage('Give me some motivation')">
            🚀 Motivate me
        </button>

    </div>

</div>
        </main>


        <!-- ========================================
             INPUT AREA
        ========================================= -->
<div class="input-wrapper">

    <!-- Voice status -->
    <div id="voiceStatus" class="voice-status">
        <span class="voice-status-dot"></span>
        <span id="voiceStatusText">Ready</span>
    </div>

    <!-- Voice settings -->
    <div id="voicePanel" class="voice-panel">

        <label for="voiceSelect">
            🗣️ YUVA Voice
        </label>

        <select id="voiceSelect">
            <option value="">✨ Default Voice</option>
        </select>

        <button
            id="stopSpeakingButton"
            class="stop-speaking-button"
            type="button"
            onclick="stopSpeaking()"
            title="Stop YUVA speaking"
        >
            ⏹
        </button>

    </div>

    <!-- Chat input -->
    <div class="input-area">

        <button
            id="micButton"
            class="mic-button"
            onclick="toggleVoiceInput()"
            title="Speak your message"
            type="button"
        >
            🎤
        </button>

        <input
            type="text"
            id="userInput"
            placeholder="Message YUVA AI..."
            autocomplete="off"
        >

        <button
            onclick="sendMessage()"
            type="button"
        >
            Send
        </button>

    </div>

</div>

    </div>

    <div id="cursorGlow"></div>

    <script src="script.js"></script>

</body>
</html>
