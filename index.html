<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YUVA AI</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ========================================
         LOGIN SCREEN
    ========================================= -->

    <div id="loginScreen" class="login-screen">

        <div class="login-card">

            <div class="login-logo">
    <div class="ai-orb">
        <div class="orb-core"></div>
        <div class="orb-ring ring-1"></div>
        <div class="orb-ring ring-2"></div>
        <div class="orb-ring ring-3"></div>
    </div>
</div>
                
            

            <h1>YUVA AI</h1>

            <p class="login-subtitle">
    Personal AI Assistant
</p>

<div class="system-status">
    <span class="status-dot"></span>
    AI SYSTEM ONLINE
</div>
                
            

            <p class="login-description">
                Enter your access password
            </p>

            <input
                type="password"
                id="creatorPassword"
                placeholder="Enter password"
                autocomplete="current-password"
            >

            <button onclick="creatorLogin()">
                Enter YUVA
            </button>

            <p id="loginMessage" class="login-message"></p>

            <div class="guest-divider">
                <span>or</span>
            </div>

            <button
                class="guest-button"
                onclick="continueAsGuest()"
            >
                Continue as Guest
            </button>

        </div>

    </div>


    <!-- ========================================
         MAIN AI APPLICATION
    ========================================= -->

    <div id="app" class="app">

        <header class="topbar">

            <div class="brand">
                <span class="brand-icon">🤖</span>

                <div>
                    <h2>YUVA AI</h2>

                    <span id="status">
                        Personal AI Assistant
                    </span>
                </div>
            </div>

            <button
                id="voiceToggle"
                class="new-chat-button"
                onclick="toggleVoiceOutput()"
                title="Toggle spoken replies"
            >
                🔊 Voice: Off
            </button>


<!-- 🔴 YUVA LIVE VOICE -->
<button
    id="liveVoiceButton"
    class="live-voice-button"
    onclick="toggleLiveVoice()"
    title="Start YUVA Live Mode"
>
    🔴 Live
</button>
            <button
                class="new-chat-button"
                onclick="clearMemory()"
            >
                New Chat
            </button>

            <button
                class="logout-button"
                onclick="creatorLogout()"
            >
                Logout
            </button>

        </header>


        <!-- ========================================
             CHAT
        ========================================= -->

        <main id="chat" class="chat">

            <div class="message ai">

                <div class="avatar">
                    🤖
                </div>

                <div class="bubble">
                    Hi! I'm YUVA AI. How can I help you?
                </div>

            </div>

        </main>


        <!-- ========================================
             INPUT AREA
        ========================================= -->
<div class="input-wrapper">

    <!-- Voice status -->
    <div id="voiceStatus" class="voice-status">
        <span class="voice-status-dot"></span>
        <span id="voiceStatusText">Ready</span>
    </div>

    <!-- Voice settings -->
    <div id="voicePanel" class="voice-panel">

        <label for="voiceSelect">
            🗣️ YUVA Voice
        </label>

        <select id="voiceSelect">
            <option value="">✨ Default Voice</option>
        </select>

        <button
            id="stopSpeakingButton"
            class="stop-speaking-button"
            type="button"
            onclick="stopSpeaking()"
            title="Stop YUVA speaking"
        >
            ⏹
        </button>

    </div>

    <!-- Chat input -->
    <div class="input-area">

        <button
            id="micButton"
            class="mic-button"
            onclick="toggleVoiceInput()"
            title="Speak your message"
            type="button"
        >
            🎤
        </button>

        <input
            type="text"
            id="userInput"
            placeholder="Message YUVA AI..."
            autocomplete="off"
        >

        <button
            onclick="sendMessage()"
            type="button"
        >
            Send
        </button>

    </div>

</div>

    </div>

    <div id="cursorGlow"></div>

    <script src="script.js"></script>

</body>
</html>
